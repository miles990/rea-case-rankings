name: Daily update

# Only the schedule and the repo owner can start this workflow. There is no
# pull_request trigger, so code from forks never runs with the Claude token.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  # 1. Reads the public web. Has no access to the Claude token.
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install yt-dlp
        run: python3 -m pip install --user --quiet "yt-dlp==2026.8.19" || echo "yt-dlp unavailable; YouTube skipped"
      - name: Collect new finds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect.mjs collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-raw
          path: data/
          include-hidden-files: true
          retention-days: 3

  # 2. Scores and translates. The token lives in the "claude" environment, which
  #    only the main branch can use. Claude runs with no tools, so scraped text
  #    can change the JSON it returns but cannot run commands or reach the network.
  enrich:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: claude
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data-raw
          path: data/
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@2.1.283"
      - name: Score new finds
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: sonnet
          MAX_SCORED_PER_RUN: "60"
        run: node scripts/collect.mjs score
      - name: Translate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: sonnet
        run: node scripts/translate.mjs
      - name: Write the daily brief
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: sonnet
        run: node scripts/daily.mjs
      - run: rm -f data/.pending-context.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-enriched
          path: data/
          retention-days: 3

  # 3. Commits the data back and builds the pages. No Claude token here.
  publish:
    needs: [collect, enrich]
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Use enriched data
        id: enriched
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data-enriched
          path: data/
      - name: Fall back to raw data
        if: ${{ steps.enriched.outcome != 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data-raw
          path: data/
      - run: rm -f data/.pending-context.json
      - name: Install image tools and dependencies
        run: |
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          npm ci --no-audit --no-fund
      - name: Fetch thumbnails
        run: node scripts/thumbs.mjs
      - name: Validate data
        run: node scripts/validate.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ site/thumbs/
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git pull --rebase --quiet && git push
      - name: Build pages
        run: node scripts/build.mjs
      - name: Check pages in a browser
        run: |
          npx playwright install --with-deps chromium
          node scripts/check.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
