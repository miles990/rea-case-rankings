<header class="top">

<main>
<section class="hero">
  <div class="wrap">
    <div>
      <div class="eyebrow" data-i18n="hero.eyebrow"></div>
      <h1><span data-i18n="hero.h1a"></span> <span class="rea">REA</span><br id="h1br"><span data-i18n="hero.h1b"></span><span class="cursor" aria-hidden="true"></span></h1>
      <p class="lede" data-i18n-html="hero.lede"></p>
      <ul class="stats" id="stats"></ul>
      <div class="hero-cta">
        <a class="btn primary" href="#explore" data-i18n="hero.cta"></a>
        <a class="btn" href="https://github.com/morluto/rea" target="_blank" rel="noopener noreferrer">morluto/rea ↗</a>
      </div>
    </div>
    <figure class="listing" aria-hidden="true">
      <div class="listing-head"><span><b>DXBALL.EXE</b> · .text</span><span data-i18n="panel.head"></span></div>
      <div class="asm" id="asm"></div>
      <div class="csrc" id="csrc"></div>
      <div class="listing-foot"><span data-i18n="panel.caption"></span><span class="pass">✓ 3,205 / 3,205</span></div>
    </figure>
  </div>
</section>

<section class="hl" aria-labelledby="hl-h">
  <div class="wrap">
    <div class="hl-head"><h2 id="hl-h" data-i18n="feat.h2"></h2><p data-i18n="feat.p"></p></div>
    <div class="hl-row" id="highlights"></div>
  </div>
</section>

<section class="explorer" id="explore" aria-label="Explorer">
  <div class="wrap ex-grid">
    <aside class="rail" id="rail" aria-label="Filters">
      <label class="search" for="q">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span class="vh" data-i18n="k.search"></span>
        <input id="q" type="search" autocomplete="off" data-i18n-ph="search.ph">
        <kbd>/</kbd>
      </label>
      <div id="facets"></div>
      <div class="rail-foot">
        <a href="#about" data-i18n="ex.howScored"></a>
        <a id="api-link" href="api/records.json" data-i18n="ex.api"></a>
      </div>
      <button class="btn only-mobile" id="rail-done" type="button" style="margin-top:16px;width:100%;justify-content:center" data-i18n="ex.done"></button>

      <div class="ex-top">
        <button class="ctl only-mobile" id="open-rail" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M6 12h12M10 18h4"></path></svg><span data-i18n="ex.filters"></span></button>

          <button type="button" data-view="timeline" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="6" cy="15" r="2.5"></circle><circle cx="12" cy="8" r="3.5"></circle><circle cx="18" cy="14" r="2"></circle><path d="M3 21h18"></path></svg><span class="vl" data-i18n="view.timeline"></span></button>

        <select id="sort" aria-label="Sort"><option value="rank" data-i18n="sort.rank"></option><option value="heat" data-i18n="sort.heat"></option><option value="new" data-i18n="sort.new"></option></select>
        <span class="count" id="count" aria-live="polite"></span>
      </div>
      <div class="active-filters" id="active"></div>
      <div id="results"></div>
    </div>

    <aside class="detail-wrap" id="detail-wrap" aria-label="Details">
      <div class="detail" id="detail"></div>
    </aside>
  </div>
</section>

<section class="block" id="latest">
  <div class="wrap">
    <div class="sec-head">
      <div><div class="eyebrow" data-i18n="day.eyebrow"></div><h2 data-i18n="day.h2"></h2></div>

    <div class="day-charts">
      <figure class="mini"><figcaption data-i18n="day.stars"></figcaption><svg id="spark-stars" role="img"></svg></figure>
      <figure class="mini"><figcaption data-i18n="day.newPerDay"></figcaption><svg id="spark-new" role="img"></svg></figure>
    </div>
    <ol class="days" id="days"></ol>
    <button class="fmore" id="days-more" type="button" hidden></button>
  </div>
</section>

<section class="block" id="about">
  <div class="wrap">
    <div class="sec-head"><div><div class="eyebrow">About</div><h2 data-i18n="about.h2"></h2></div></div>
    <div class="about">
      <details open><summary data-i18n="rubric.h"></summary><div class="body"><ul class="rubric" id="rubric"></ul></div></details>
      <details open><summary data-i18n="heat.h"></summary><div class="body"><p data-i18n="heat.note"></p><p data-i18n="sort.note"></p></div></details>
      <details><summary data-i18n="how.h2"></summary><div class="body"><ol class="steps"><li><b data-i18n="how.1h"></b> — <span data-i18n="how.1p"></span></li><li><b data-i18n="how.2h"></b> — <span data-i18n="how.2p"></span></li><li><b data-i18n="how.3h"></b> — <span data-i18n="how.3p"></span></li></ol></div></details>
      <details><summary data-i18n="agent.h"></summary><div class="body"><p data-i18n="agent.p"></p><div class="code" id="agent-code"></div></div></details>
    </div>
  </div>
</section>
