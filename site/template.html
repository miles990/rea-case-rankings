<style>
/* Layout: a disassembler listing. Hero pairs the thesis with an asm→C panel;
   featured "selections" sit above a scannable, filterable ledger; an auto-fed log closes. */
:root {
  --paper: #f1f2f4;
  --panel: #ffffff;
  --panel-2: #f7f8fa;
  --ink: #12151b;
  --muted: #5d6573;
  --faint: #8a92a0;
  --rule: #d9dce2;
  --link: #2145d6;
  --link-soft: #e6ebfd;
  --select: #ffe39a;
  --select-ink: #3d2c00;
  --ok: #16794a;
  --ok-soft: #dcf3e6;
  --ship: #2145d6;
  --ship-soft: #e6ebfd;
  --said: #8a5a00;
  --said-soft: #fbefd2;
  --code-bg: #12151b;
  --code-ink: #d7dce6;
  --code-dim: #6f7889;
  --code-op: #8fb2ff;
  --code-num: #ffcf6b;
  --code-hl: rgba(255, 207, 107, .16);
  --f-display: "Archivo", "Noto Sans TC", system-ui, sans-serif;
  --f-body: "Noto Sans TC", "Archivo", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1015; --panel: #151920; --panel-2: #1a1f27; --ink: #e8ebf1; --muted: #a0a8b6; --faint: #6e7786;
    --rule: #272d37; --link: #87a4ff; --link-soft: #1c2645; --select: #574310; --select-ink: #ffe39a;
    --ok: #5fd99a; --ok-soft: #12301f; --ship: #87a4ff; --ship-soft: #1c2645; --said: #e9bd5b; --said-soft: #33270b;
    --code-bg: #080a0e; --code-hl: rgba(255, 207, 107, .12);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1015; --panel: #151920; --panel-2: #1a1f27; --ink: #e8ebf1; --muted: #a0a8b6; --faint: #6e7786;
  --rule: #272d37; --link: #87a4ff; --link-soft: #1c2645; --select: #574310; --select-ink: #ffe39a;
  --ok: #5fd99a; --ok-soft: #12301f; --ship: #87a4ff; --ship-soft: #1c2645; --said: #e9bd5b; --said-soft: #33270b;
  --code-bg: #080a0e; --code-hl: rgba(255, 207, 107, .12);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); }
.mono { font-family: var(--f-mono); }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sel { background: var(--select); color: var(--select-ink); padding: .05em .35em; border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

/* Top bar */
.top { border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-variation-settings: "wdth" 118; font-weight: 800; letter-spacing: -.01em; font-size: 16px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.brand-mark { font-family: var(--f-mono); font-size: 11px; font-weight: 700; background: var(--ink); color: var(--paper); padding: 2px 6px; border-radius: 3px; letter-spacing: .04em; }
.top nav { margin-left: auto; display: flex; gap: 18px; flex-wrap: wrap; font-size: 13.5px; }
.top nav a { color: var(--muted); }
.top nav a:hover { color: var(--ink); }

/* Hero */
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); padding-block: clamp(36px, 6vw, 72px) clamp(28px, 4vw, 48px); align-items: center; }
.hero h1 { margin: 14px 0 18px; font-family: var(--f-body); font-weight: 900; font-size: clamp(40px, 6.4vw, 78px); line-height: 1.04; letter-spacing: -.02em; text-wrap: balance; }
.hero h1 .rea { font-family: var(--f-display); font-variation-settings: "wdth" 125; font-weight: 900; letter-spacing: -.03em; }
.hero h1 .cursor { display: inline-block; width: .08em; height: .82em; background: var(--link); vertical-align: -.04em; margin-left: .06em; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.lede { font-size: clamp(15.5px, 1.5vw, 17.5px); color: var(--muted); max-width: 36em; margin: 0 0 26px; }
.lede b { color: var(--ink); font-weight: 700; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 0; padding: 0; list-style: none; }
.stats li { display: grid; gap: 0; }
.stats .n { font-family: var(--f-display); font-variation-settings: "wdth" 112; font-weight: 800; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats .l { font-size: 12.5px; color: var(--muted); }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
.btn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: var(--radius); border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer; }
.btn:hover { text-decoration: none; border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* asm → C panel */
.listing { border: 1px solid rgba(255,255,255,.08); background: var(--code-bg); color: var(--code-ink); border-radius: 10px; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.75; overflow: hidden; box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 24px 60px -30px rgba(10, 14, 30, .55); }
.listing-head { display: flex; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,.07); color: var(--code-dim); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.listing-head b { color: var(--code-ink); font-weight: 500; }
.asm, .csrc { padding: 10px 0; overflow-x: auto; }
.asm div, .csrc div { padding: 0 16px; white-space: pre; transition: background .25s; }
.asm .on, .csrc .on { background: var(--code-hl); }
.asm .a { color: var(--code-dim); }
.asm .b { color: #9aa3b4; }
.asm .o { color: var(--code-op); }
.asm .c, .csrc .c { color: var(--code-dim); }
.csrc { border-top: 1px dashed rgba(255,255,255,.12); }
.csrc .k { color: var(--code-op); }
.csrc .n { color: var(--code-num); }
.listing-foot { padding: 9px 16px; border-top: 1px solid rgba(255,255,255,.07); color: var(--code-dim); font-size: 11px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.listing-foot .pass { color: #7be0a6; }

/* Section heads */
section.block { padding-block: clamp(28px, 4vw, 48px); }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.sec-head h2 { margin: 4px 0 0; font-family: var(--f-display); font-variation-settings: "wdth" 115; font-weight: 800; font-size: clamp(24px, 3vw, 32px); letter-spacing: -.015em; line-height: 1.15; }
.sec-head h2 small { font-family: var(--f-body); font-weight: 700; font-size: .8em; margin-left: .3em; }
.sec-head p { margin: 0; color: var(--muted); font-size: 14px; max-width: 34em; }

/* Featured */
.feat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.fcard { position: relative; display: flex; flex-direction: column; gap: 10px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 18px 16px; min-width: 0; transition: border-color .2s, transform .2s; }
.fcard:hover { border-color: var(--ink); transform: translateY(-2px); }
.fcard .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.fcard .addr { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.fcard h3 { margin: 0; font-size: 17.5px; line-height: 1.4; font-weight: 700; text-wrap: balance; }
.fcard h3 a { color: var(--ink); }
.fcard h3 a::after { content: ""; position: absolute; inset: 0; border-radius: 10px; }
.fcard .metric { font-family: var(--f-mono); font-size: 12.5px; line-height: 1.7; }
.fcard .by { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--rule); }
.fcard .by .go { font-family: var(--f-mono); font-size: 12px; color: var(--link); white-space: nowrap; }

/* Toolbar */
.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-block: 1px solid var(--rule); margin-bottom: 4px; }
.toolbar .wrap { display: grid; gap: 10px; padding-block: 12px; }
.tb-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search { flex: 1 1 260px; position: relative; min-width: 0; }
.search input { width: 100%; font: inherit; font-size: 14.5px; padding: 9px 12px 9px 34px; border-radius: var(--radius); border: 1px solid var(--rule); background: var(--panel); color: var(--ink); }
.search input:focus { outline: 2px solid var(--link); outline-offset: -1px; border-color: transparent; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-family: var(--f-mono); font-size: 11px; color: var(--faint); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; }
select { font: inherit; font-size: 13.5px; padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--rule); background: var(--panel); color: var(--ink); }
.count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chips .lab { font-family: var(--f-mono); font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; min-width: 3.2em; }
.chip { font: inherit; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--rule); background: var(--panel); color: var(--muted); cursor: pointer; white-space: nowrap; }
.chip:hover { color: var(--ink); border-color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .k { font-family: var(--f-mono); font-size: 10.5px; opacity: .65; margin-left: 4px; }
.chip-scroll { overflow-x: auto; scrollbar-width: none; }
.chip-scroll::-webkit-scrollbar { display: none; }
.chip-scroll .chips { flex-wrap: nowrap; }

/* Ledger */
.ledger { list-style: none; margin: 0; padding: 0; }
.case { display: grid; grid-template-columns: 62px minmax(0, 1fr) 210px; gap: 18px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
.case:target { background: var(--panel); }
.case .off { font-family: var(--f-mono); font-size: 12px; color: var(--faint); padding-top: 3px; font-variant-numeric: tabular-nums; }
.case .main { min-width: 0; display: grid; gap: 6px; }
.case h3 { margin: 0; font-size: 16.5px; line-height: 1.45; font-weight: 700; }
.case h3 a { color: var(--ink); }
.case h3 a:hover { color: var(--link); }
.case h3 .ext { font-family: var(--f-mono); font-size: 11px; color: var(--faint); font-weight: 400; margin-left: 6px; white-space: nowrap; }
.case .target { font-size: 13px; color: var(--muted); }
.case .target b { font-weight: 500; color: var(--ink); }
.case .metric { font-family: var(--f-mono); font-size: 12.5px; }
.case .sum { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.case.open .sum { -webkit-line-clamp: unset; display: block; }
.more { font: inherit; font-size: 12.5px; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; justify-self: start; }
.links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.links a { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 10px; border-radius: 4px; background: var(--link-soft); color: var(--link); max-width: 100%; }
.links a:hover { text-decoration: none; filter: brightness(.96); }
.links a .dom { font-family: var(--f-mono); font-size: 10.5px; opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.case .meta { display: grid; gap: 7px; align-content: start; font-size: 13px; }
.case .who { font-weight: 600; overflow-wrap: anywhere; }
.case .who a { color: var(--ink); }
.case .tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 3px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
.tag.lang { font-family: var(--f-mono); text-transform: uppercase; font-size: 10.5px; letter-spacing: .04em; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.tested { background: var(--ok-soft); color: var(--ok); }
.pill.shipped { background: var(--ship-soft); color: var(--ship); }
.pill.reported { background: var(--said-soft); color: var(--said); }
.wow { display: flex; gap: 3px; align-items: center; }
.wow i { width: 14px; height: 5px; border-radius: 1px; background: var(--rule); }
.wow i.f { background: var(--ink); }
.wow span { font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); margin-left: 4px; }
.date { font-family: var(--f-mono); font-size: 11.5px; color: var(--faint); }
.empty { padding: 48px 0; text-align: center; color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 14px; }

/* Discovered */
.feed-wrap { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.feed-tools { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.feed { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.feed-scroll { overflow-x: auto; }
.feed th { text-align: left; font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 9px 14px; border-bottom: 1px solid var(--rule); background: var(--panel-2); white-space: nowrap; }
.feed td { padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.feed tr:last-child td { border-bottom: 0; }
.feed td.t { min-width: 260px; }
.feed td.t a { color: var(--ink); font-weight: 500; }
.feed td.t a:hover { color: var(--link); }
.feed td.s, .feed td.d { white-space: nowrap; color: var(--muted); font-size: 12.5px; }
.feed td.d { font-family: var(--f-mono); font-size: 11.5px; }
.new { font-family: var(--f-mono); font-size: 10px; font-weight: 700; color: var(--select-ink); background: var(--select); padding: 0 5px; border-radius: 2px; margin-left: 6px; vertical-align: 1px; }
.feed-foot { padding: 10px 14px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }

/* How it updates */
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--panel); }
.how > div { padding: 18px 20px; border-right: 1px solid var(--rule); min-width: 0; }
.how > div:last-child { border-right: 0; }
.how h4 { margin: 6px 0 6px; font-size: 15px; }
.how p { margin: 0; color: var(--muted); font-size: 13.5px; }
.how .step { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }

footer { border-top: 1px solid var(--rule); margin-top: clamp(24px, 4vw, 48px); }
footer .wrap { padding-block: 22px 40px; display: flex; gap: 16px; justify-content: space-between; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }

@media (max-width: 960px) {
  .hero .wrap { grid-template-columns: minmax(0, 1fr); }
  .feat { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .case { grid-template-columns: 48px minmax(0, 1fr); }
  .case .meta { grid-column: 2; grid-row: 2; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
}
@media (max-width: 640px) {
  .feat { grid-template-columns: minmax(0, 1fr); }
  .how { grid-template-columns: minmax(0, 1fr); }
  .how > div { border-right: 0; border-bottom: 1px solid var(--rule); }
  .how > div:last-child { border-bottom: 0; }
  .case { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .case .off { display: none; }
  .case .meta { grid-column: 1; grid-row: auto; }
  .listing { font-size: 11.5px; }
  .search kbd { display: none; }
  .top nav { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* Language switcher */
.langs { display: flex; gap: 2px; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; background: var(--panel); }
.langs a, .langs button { font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 999px; color: var(--muted); background: none; border: 0; cursor: pointer; white-space: nowrap; }
.langs a:hover, .langs button:hover { color: var(--ink); text-decoration: none; }
.langs [aria-current="true"] { background: var(--ink); color: var(--paper); }

/* Rank + score */
.rk { font-family: var(--f-display); font-variation-settings: "wdth" 110; font-weight: 800; font-size: 22px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; padding-top: 2px; }
.rk small { display: block; font-family: var(--f-mono); font-size: 10.5px; font-weight: 400; color: var(--faint); margin-top: 6px; letter-spacing: .02em; }
.case.top3 .rk { color: var(--link); }
.srcb { font-family: var(--f-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 3px; border: 1px dashed var(--rule); color: var(--muted); white-space: nowrap; }
.srcb.auto { border-style: dashed; }
.srcb.curated { border-style: solid; }
.orig { font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }
.rubric { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 6px; font-size: 13.5px; color: var(--muted); }
.rubric li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; align-items: center; }
.rubric-h { margin: 26px 0 0; font-size: 15px; }
@media (max-width: 640px) { .rubric li { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
</style>

<section class="block" id="featured">
  <div class="wrap">
    <div class="sec-head">
      <div><div class="eyebrow" data-i18n="feat.eyebrow"></div><h2 data-i18n="feat.h2"></h2></div>
      <p data-i18n="feat.p"></p>
    </div>
    <div class="feat" id="feat"></div>
  </div>
</section>

<section id="ranking">
  <div class="wrap">
    <div class="sec-head" style="margin-bottom:14px">
      <div><div class="eyebrow" data-i18n="rank.eyebrow"></div><h2 data-i18n="rank.h2"></h2></div>
      <p data-i18n="rank.p"></p>
    </div>
  </div>
  <div class="toolbar">
    <div class="wrap">
      <div class="tb-row">
        <label class="search" for="q">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="q" type="search" autocomplete="off" data-i18n-ph="search.ph">
          <kbd>/</kbd>
        </label>
        <select id="sort" aria-label="Sort"><option value="rank" data-i18n="sort.rank"></option><option value="new" data-i18n="sort.new"></option></select>
        <span class="count" id="count"></span>
      </div>
      <div class="chip-scroll"><div class="chips" id="f-cat"></div></div>
      <div class="tb-row" style="gap:14px">
        <div class="chips" id="f-lang"></div>
        <div class="chips" id="f-status"></div>
        <div class="chips" id="f-src"></div>
      </div>
    </div>
  </div>
  <div class="wrap">
    <ol class="ledger" id="ledger"></ol>
    <div class="legend">
      <span><span class="pill tested" data-i18n="status.tested"></span> <span data-i18n="legend.tested"></span></span>
      <span><span class="pill shipped" data-i18n="status.shipped"></span> <span data-i18n="legend.shipped"></span></span>
      <span><span class="pill reported" data-i18n="status.reported"></span> <span data-i18n="legend.reported"></span></span>
    </div>
  </div>
</section>

<section class="block" id="latest">
  <div class="wrap">
    <div class="sec-head">
      <div><div class="eyebrow" data-i18n="new.eyebrow"></div><h2 data-i18n="new.h2"></h2></div>
      <p data-i18n="new.p"></p>
    </div>
    <div class="feed-wrap">
      <div class="feed-tools">
        <span class="count" id="scan"></span>
      </div>
      <div class="feed-scroll">
        <table class="feed">
          <thead><tr><th data-i18n="new.th.day"></th><th data-i18n="new.th.rank"></th><th data-i18n="new.th.score"></th><th data-i18n="new.th.title"></th><th data-i18n="new.th.via"></th></tr></thead>
          <tbody id="feed"></tbody>
        </table>
      </div>
      <div class="feed-foot"><span id="feed-note"></span><button class="more" id="feed-all" type="button"></button></div>
    </div>
  </div>
</section>

<section class="block" id="how">
  <div class="wrap">
    <div class="sec-head"><div><div class="eyebrow">Pipeline</div><h2 data-i18n="how.h2"></h2></div></div>
    <div class="how">
      <div><div class="step">01 · cron 01:00 UTC</div><h4 data-i18n="how.1h"></h4><p data-i18n="how.1p"></p></div>
      <div><div class="step">02 · Claude</div><h4 data-i18n="how.2h"></h4><p data-i18n="how.2p"></p></div>
      <div><div class="step">03 · GitHub Pages</div><h4 data-i18n="how.3h"></h4><p data-i18n="how.3p"></p></div>
    </div>
    <h4 class="rubric-h" data-i18n="rubric.h"></h4>
    <ul class="rubric" id="rubric"></ul>
  </div>
</section>

<footer>
  <div class="wrap">
    <span><span data-i18n="foot.updated"></span> <span class="mono" id="updated"></span> · <span data-i18n="foot.rights"></span></span>
    <span data-i18n="foot.legal"></span>
  </div>
</footer>

<script>
const DATA = __DATA__;
const UI = __UI__;
const PAGE_LANG = __LANG__;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
const safe = (u) => (/^https?:\/\//i.test(u || "") ? u : "#");
const LANGS = Object.keys(UI);

function pickLang() {
  if (PAGE_LANG) return PAGE_LANG;
  try { const s = localStorage.getItem("rea-lang"); if (UI[s]) return s; } catch {}
  for (const l of navigator.languages || [navigator.language || "en"]) {
    const x = l.toLowerCase();
    if (/^zh-(tw|hk|mo|hant)/.test(x)) return "zh-TW";
    if (x.startsWith("zh")) return "zh-CN";
    for (const k of ["ja", "ko", "en"]) if (x.startsWith(k)) return k;
  }
  return "en";
}
let lang = pickLang();
const t = (k) => UI[lang][k] ?? UI["zh-TW"][k] ?? k;
const tx = (r, f) => (lang !== "zh-TW" && DATA.i18n[r.id]?.[lang]?.[f]) || r[f] || "";
const catName = (c) => t("cat")[c] || c;
const langName = (l) => t("langs")[l] || l;

const records = DATA.records.map((r, i) => ({ ...r, rank: i + 1 }));
const latest = records.reduce((m, r) => ((r.added || "") > m ? r.added : m), "");

// Hero asm → C panel: each asm line maps to the C line it becomes.
const ASM = [
  ["00401A30", "55", "push", "ebp", "", 0], ["00401A31", "8B EC", "mov", "ebp, esp", "", 0],
  ["00401A33", "8B 45 08", "mov", "eax, [ebp+8]", "; x", 2], ["00401A36", "69 C0 C8 00 00 00", "imul", "eax, eax, 200", "", 2],
  ["00401A3C", "99", "cdq", "", "", 2], ["00401A3D", "B9 7F 02 00 00", "mov", "ecx, 639", "", 2],
  ["00401A42", "F7 F9", "idiv", "ecx", "", 2], ["00401A44", "83 E8 64", "sub", "eax, 100", "", 2],
  ["00401A47", "5D", "pop", "ebp", "", 3], ["00401A48", "C3", "ret", "", "", 3],
];
const CSRC = [
  `<span class="k">int</span> pan_from_x(<span class="k">int</span> x)   <span class="c">// x: 0‥639</span>`, `{`,
  `    <span class="k">return</span> x * <span class="n">200</span> / <span class="n">639</span> - <span class="n">100</span>;  <span class="c">// -100‥100</span>`, `}`,
];
$("#asm").innerHTML = ASM.map(([a, b, o, r, c]) => `<div><span class="a">${a}</span>  <span class="b">${b.padEnd(18)}</span><span class="o">${o.padEnd(6)}</span>${r.padEnd(14)}<span class="c">${c}</span></div>`).join("");
$("#csrc").innerHTML = CSRC.map((l) => `<div>${l}</div>`).join("");
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const a = [...$("#asm").children], c = [...$("#csrc").children];
  let i = 0;
  setInterval(() => {
    a.forEach((el, j) => el.classList.toggle("on", j === i));
    c.forEach((el, j) => el.classList.toggle("on", j === ASM[i][5]));
    i = (i + 1) % ASM.length;
  }, 900);
}

// Language switcher: real pages on GitHub Pages, in-page switching elsewhere.
function renderLangs() {
  $("#langs").innerHTML = LANGS.map((l) => DATA.pages
    ? `<a href="${esc(DATA.pages[l])}" hreflang="${esc(UI[l]._html)}" aria-current="${l === lang}">${esc(UI[l]._short)}</a>`
    : `<button type="button" data-l="${l}" aria-current="${l === lang}">${esc(UI[l]._short)}</button>`).join("");
}
$("#langs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-l]");
  const a = e.target.closest("a[hreflang]");
  if (a) { try { localStorage.setItem("rea-lang", LANGS.find((l) => DATA.pages[l] === a.getAttribute("href"))); } catch {} return; }
  if (!b) return;
  lang = b.dataset.l;
  try { localStorage.setItem("rea-lang", lang); } catch {}
  renderAll();
});

const wowBar = (w) => w == null ? `<span class="srcb">${esc(t("row.unscored"))}</span>`
  : `<span class="wow" title="${w}/5">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= w ? "f" : ""}"></i>`).join("")}<span>${w}/5</span></span>`;

// Filters
const state = { q: "", cat: null, lang: null, status: null, source: null, sort: "rank" };
const FILTERS = [
  ["#f-cat", "cat", "category", "f.cat", catName],
  ["#f-lang", "lang", "lang", "f.lang", langName],
  ["#f-status", "status", "status", "f.status", (v) => t("status." + v)],
  ["#f-src", "source", "source", "f.src", (v) => t("src." + v)],
];
function renderChips() {
  for (const [sel, key, field, label, name] of FILTERS) {
    const m = new Map();
    records.forEach((r) => r[field] && m.set(r[field], (m.get(r[field]) || 0) + 1));
    const entries = [...m].sort((a, b) => b[1] - a[1]);
    $(sel).innerHTML = `<span class="lab">${esc(t(label))}</span>` +
      `<button class="chip" type="button" aria-pressed="${state[key] == null}">${esc(t("f.all"))}</button>` +
      entries.map(([v, n]) => `<button class="chip" type="button" data-v="${esc(v)}" aria-pressed="${state[key] === v}">${esc(name(v))}<span class="k">${n}</span></button>`).join("");
    $(sel).onclick = (e) => {
      const b = e.target.closest(".chip"); if (!b) return;
      state[key] = b.dataset.v ?? null;
      renderChips(); renderList();
    };
  }
}

function renderList() {
  const q = state.q.trim().toLowerCase();
  const list = records.filter((r) =>
    (!state.cat || r.category === state.cat) && (!state.lang || r.lang === state.lang) &&
    (!state.status || r.status === state.status) && (!state.source || r.source === state.source) &&
    (!q || [tx(r, "title"), tx(r, "summary"), tx(r, "target"), tx(r, "metric"), r.title, r.summary, r.original_title, r.author, catName(r.category)].join(" ").toLowerCase().includes(q)));
  if (state.sort === "new") list.sort((a, b) => (b.date || b.added || "").localeCompare(a.date || a.added || "") || a.rank - b.rank);
  $("#count").textContent = `${list.length} / ${records.length}`;
  $("#ledger").innerHTML = list.length ? list.map((r) => {
    const main = r.links[0];
    const title = tx(r, "title"), target = tx(r, "target"), metric = tx(r, "metric"), summary = tx(r, "summary");
    return `<li class="case${r.rank <= 3 ? " top3" : ""}" id="r-${esc(r.id)}">
      <div class="rk">#${r.rank}<small>${esc(r.added === latest && r.source === "auto" ? t("new.badge") : "")}</small></div>
      <div class="main">
        <h3><a href="${esc(safe(main.url))}" target="_blank" rel="noopener noreferrer">${esc(title)}</a><span class="ext">${esc(host(main.url))} ↗</span></h3>
        ${r.original_title && r.original_title !== r.title ? `<div class="orig">${esc(t("row.orig"))}: ${esc(r.original_title)}</div>` : ""}
        ${target ? `<div class="target">${esc(t("row.target"))}: <b>${esc(target)}</b></div>` : ""}
        ${metric ? `<div class="metric"><span class="sel">${esc(metric)}</span></div>` : ""}
        ${summary ? `<p class="sum">${esc(summary)}</p><button class="more" type="button">${esc(t("row.more"))}</button>` : ""}
        <div class="links">${r.links.map((l) => `<a href="${esc(safe(l.url))}" target="_blank" rel="noopener noreferrer">${esc(l.label)}<span class="dom">${esc(host(l.url))}</span></a>`).join("")}</div>
      </div>
      <div class="meta">
        ${r.author ? `<span class="who">${r.author_url ? `<a href="${esc(safe(r.author_url))}" target="_blank" rel="noopener noreferrer">${esc(r.author)}</a>` : esc(r.author)}</span>` : ""}
        <span class="tags"><span class="tag lang">${esc(langName(r.lang))}</span><span class="tag">${esc(catName(r.category))}</span></span>
        ${r.status ? `<span class="pill ${esc(r.status)}">${esc(t("status." + r.status))}</span>` : ""}
        ${wowBar(r.wow)}
        <span class="tags"><span class="srcb ${esc(r.source)}">${esc(t("src." + r.source))}</span><span class="date">${esc(r.date || r.added || t("row.nodate"))}</span></span>
      </div>
    </li>`;
  }).join("") : `<li class="empty">${esc(t("empty"))}</li>`;
  document.querySelectorAll(".case").forEach((li) => {
    const sum = li.querySelector(".sum"), btn = li.querySelector(".more");
    if (sum && btn && sum.scrollHeight <= sum.clientHeight + 2) btn.hidden = true;
  });
}
$("#ledger").addEventListener("click", (e) => {
  const b = e.target.closest(".more"); if (!b) return;
  const li = b.closest(".case"); li.classList.toggle("open");
  b.textContent = t(li.classList.contains("open") ? "row.less" : "row.more");
});
$("#q").addEventListener("input", (e) => { state.q = e.target.value; renderList(); });
$("#sort").addEventListener("change", (e) => { state.sort = e.target.value; renderList(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
});

let showAll = false;
function renderFeed() {
  const rows = [...records].sort((a, b) => (b.added || "").localeCompare(a.added || "") || a.rank - b.rank);
  const shown = showAll ? rows : rows.slice(0, 15);
  $("#feed").innerHTML = shown.map((r) => `<tr>
    <td class="d">${esc((r.added || "").slice(5))}</td>
    <td class="d"><a href="#r-${esc(r.id)}">#${r.rank}</a></td>
    <td class="s">${r.wow == null ? "—" : r.wow + "/5"}</td>
    <td class="t"><a href="${esc(safe(r.links[0].url))}" target="_blank" rel="noopener noreferrer">${esc(tx(r, "title"))}</a>${r.added === latest ? `<span class="new">${esc(t("new.badge"))}</span>` : ""}</td>
    <td class="s">${esc(r.via)}</td></tr>`).join("");
  $("#feed-note").textContent = t("new.showing").replace("{a}", shown.length).replace("{b}", rows.length);
  $("#feed-all").hidden = rows.length <= 15;
  $("#feed-all").textContent = t(showAll ? "new.less" : "new.all");
}
$("#feed-all").addEventListener("click", () => { showAll = !showAll; renderFeed(); });

function renderAll() {
  document.documentElement.lang = UI[lang]._html;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  renderLangs();
  $("#h1br").hidden = !t("hero.h1b");

  const langs = new Set(records.map((r) => r.lang));
  const stars = DATA.repo?.stars;
  $("#stats").innerHTML = [
    [records.length, t("stat.ranked")],
    [records.filter((r) => r.wow === 5).length, t("stat.top")],
    [langs.size, t("stat.langs")],
    [stars ? Math.round(stars / 1000) + "k" : "—", t("stat.stars")],
  ].map(([n, l]) => `<li><span class="n">${n}</span><span class="l">${esc(l)}</span></li>`).join("");

  $("#feat").innerHTML = records.filter((r) => r.wow === 5).slice(0, 6).map((r) => {
    const l = r.links[0];
    return `<article class="fcard">
      <div class="row1"><span class="eyebrow">${esc(catName(r.category))}</span><span class="addr">#${r.rank}</span></div>
      <h3><a href="${esc(safe(l.url))}" target="_blank" rel="noopener noreferrer">${esc(tx(r, "title"))}</a></h3>
      <div class="metric"><span class="sel">${esc(tx(r, "metric"))}</span></div>
      <div class="by"><span>${esc(r.author)}</span><span class="go">${esc(host(l.url))} ↗</span></div>
    </article>`;
  }).join("");

  $("#rubric").innerHTML = [5, 4, 3, 2, 1].map((n) => `<li>${wowBar(n)}<span>${esc(t("rubric." + n))}</span></li>`).join("");
  $("#updated").textContent = DATA.updated;
  $("#scan").textContent = `${t("new.scan")} ${DATA.scanned || DATA.updated}`;
  if (DATA.site?.repo) $("#repo-link").href = DATA.site.repo;
  renderChips(); renderList(); renderFeed();
}
renderAll();
</script>
